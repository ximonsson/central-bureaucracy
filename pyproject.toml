[project]
name = "central-bureaucracy"
version = "0.1.0"
description = "Helpes me with my notes."
readme = "README.md"
authors = [
    { name = "Simon Simonsson", email = "simonsson.simon@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ddgs>=9.4.3",
    "dotenv>=0.9.9",
    "duckdb>=1.3.2",
    "langchain-community>=0.3.24",
    "langchain-tavily>=0.2.1",
    "langchain[openai]>=0.3.25",
    "langgraph>=0.4.8",
    "lxml[html-clean]>=6.0.0",
    "mistralai>=1.8.2",
    "mlflow[genai]>=2.22.1",
    "newspaper3k>=0.2.8",
    "openai>=1.84.0",
    "openai-agents>=0.2.3",
    "polars>=1.31.0",
    "psutil>=7.0.0",
    "pyinotify>=0.9.6",
    "pyyaml>=6.0.2",
    "smolagents[openai,toolkit]>=1.17.0",
    "trafilatura>=1.6.1",
]

[project.scripts]
central-bureaucracy = "central_bureaucracy:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipython>=9.3.0",
]
