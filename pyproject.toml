[project]
name = "central-bureaucracy"
version = "0.1.0"
description = "Helpes me with my notes."
readme = "README.md"
authors = [
    { name = "Simon Simonsson", email = "simonsson.simon@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ddgs>=9.4.3",
    "dotenv>=0.9.9",
    "duckdb>=1.3.2",
    "lxml[html-clean]>=6.0.0",
    "mistralai<=1.8.2",
    "mlflow[genai]>=2.22.1",
    "openai>=1.97",
    "openai-agents[litellm]>=0.2.3",
    "opentelemetry-exporter-otlp-proto-grpc>=1.36.0",
    "psutil>=7.0.0",
    "pyinotify>=0.9.6",
    "pyyaml>=6.0.2",
    "smolagents[openai,toolkit]>=1.17.0",
    "trafilatura>=1.6.1",
]

[project.scripts]
central-bureaucracy = "central_bureaucracy:main"
fetch = "central_bureaucracy:main_fetch"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipython>=9.3.0",
]
